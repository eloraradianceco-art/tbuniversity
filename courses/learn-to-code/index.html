<style>
:root{
 --ink:#0b1a28;--plan:#102a40;--plan2:#143450;--hover:#19405f;
 --chalk:#eaf2f5;--dim:#9bb2c1;--faint:#6a8396;--line:#2b516f;
 --cyan:#6fc3df;--pencil:#f6c61a;--lumber:#d9a441;--hazard:#ff7a2f;--pass:#5fd49a;--code:#07131e;
 --fd:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
 --fb:'Source Serif 4',Georgia,'Times New Roman',serif;
 --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
 --bad:var(--hazard);--good:var(--pass);--warn:var(--hazard);--gold:var(--pencil);--gold2:var(--pencil);--border:var(--line);--text:var(--chalk);--panel:var(--plan);--panel2:var(--plan2)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background-color:var(--ink);
 background-image:linear-gradient(rgba(111,195,223,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(111,195,223,.075) 1px,transparent 1px),linear-gradient(rgba(111,195,223,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(111,195,223,.04) 1px,transparent 1px);
 background-size:96px 96px,96px 96px,24px 24px,24px 24px;
 color:var(--chalk);font-family:var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:84px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 0}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.eyebrow{font:600 17px var(--fd);letter-spacing:.03em;color:var(--cyan);margin:0 0 2px}
h1{font:800 clamp(40px,11vw,56px)/.95 var(--fd);letter-spacing:.005em;margin:0 0 10px;text-wrap:balance}
h2{font:800 31px/1 var(--fd);letter-spacing:.005em;margin:34px 0 10px}
h3{font:800 23px/1.05 var(--fd);margin:26px 0 8px;color:var(--cyan)}
h4{font:800 19px var(--fd);margin:18px 0 4px}
p{margin:0 0 14px;font-size:17px}
.sub{color:var(--dim);font-size:16px;margin:0 0 18px}
strong,b{font-weight:600}
code{font-family:var(--fm);font-size:.84em;background:rgba(7,19,30,.85);border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:#ffe08a}
a{color:var(--pencil);text-underline-offset:3px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,19,30,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;position:relative;background:none;border:0;color:var(--faint);padding:9px 2px 8px;font:600 14px var(--fd);letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
.nav button.on{color:var(--pencil)}
.nav button.on::before{content:'';position:absolute;top:-1px;left:50%;width:30px;margin-left:-15px;height:3px;background:var(--pencil)}
/* surfaces */
.card{background:var(--plan);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin:0 0 10px}
.card.click{cursor:pointer;transition:background .15s,border-color .15s}.card.click:hover{background:var(--plan2);border-color:var(--cyan)}
.row{display:flex;gap:14px;align-items:center}.grow{flex:1;min-width:0}
.tag{font:600 15px var(--fd);letter-spacing:.03em;color:var(--cyan)}
.bar{height:8px;background:rgba(7,19,30,.9);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lumber)}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(11,26,40,.7) 11px 12px);pointer-events:none}
/* buttons: steel plate (chamfered) for the main action, outline for the rest */
.btn{background:var(--pencil);color:#1b1500;border:0;padding:11px 20px;font:800 17px var(--fd);letter-spacing:.05em;cursor:pointer;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--chalk);clip-path:none;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--line);padding:11px 16px}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--cyan);filter:none}
.btn.sm{padding:8px 14px;font-size:15px}.btn.sm.ghost{padding:8px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.back{background:none;border:0;color:var(--dim);font:600 16px var(--fd);letter-spacing:.03em;cursor:pointer;padding:0;margin-bottom:14px}
.back:hover{color:var(--chalk)}
ul.l{margin:0 0 14px;padding-left:20px;font-size:17px}ul.l li{margin:5px 0}
/* notes pinned with masking tape; cautions get hazard striping */
.callout{position:relative;background:var(--plan);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:14px 16px 10px;margin:20px 0 16px;border-radius:0 2px 2px 0}
.callout::before{content:'';position:absolute;top:-8px;left:14px;width:46px;height:15px;background:rgba(246,198,26,.55);transform:rotate(-2deg)}
.callout.key{border-left-color:var(--pencil)}
.callout.warn{border-left-color:transparent}
.callout.warn::after{content:'';position:absolute;left:-4px;top:-1px;bottom:-1px;width:4px;background:repeating-linear-gradient(135deg,var(--hazard) 0 5px,#2a1608 5px 10px)}
.callout.warn::before{background:rgba(255,122,47,.5)}
.callout p{font-size:16px;margin:0 0 8px}.callout p:last-child{margin:0 0 4px}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--plan);border:1.5px solid var(--line);color:var(--chalk);padding:13px 14px;border-radius:2px;margin:8px 0;font:400 17px var(--fb);cursor:pointer;transition:border-color .12s,background .12s}
.opt.mono{font-family:var(--fm);font-size:14px;white-space:pre-wrap}
.opt:hover{background:var(--plan2);border-color:var(--cyan)}.opt.sel{border-color:var(--pencil);background:var(--plan2)}
.opt.ok{border-color:var(--pass);background:rgba(95,212,154,.12)}.opt.no{border-color:var(--hazard);background:rgba(255,122,47,.12)}
.pill{display:inline-block;font:600 15px var(--fd);letter-spacing:.03em;padding:0 9px;border:1.5px solid var(--line);color:var(--dim);white-space:nowrap;border-radius:2px}
.pill.g{color:var(--pass);border-color:var(--pass)}.pill.b{color:var(--hazard);border-color:var(--hazard)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat div{background:var(--plan);border:1px solid var(--line);padding:10px 10px 12px;border-top:6px solid var(--lumber)}
.stat b{display:block;font:800 40px/1 var(--fd);color:var(--pencil)}.stat span{font:600 15px var(--fd);letter-spacing:.03em;color:var(--dim)}
.foot{font-size:14px;color:var(--faint);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.verse{font-style:italic;color:var(--dim);font-size:16px;margin:0 0 6px}
/* code */
textarea.code,pre.static{display:block;width:100%;background:var(--code);border:1px solid var(--line);color:#e8eef2;font:400 14px/1.55 var(--fm);padding:12px 14px;border-radius:2px;tab-size:2;white-space:pre;overflow:auto;resize:vertical;margin:0}
pre.static{resize:none;margin:10px 0 14px;border-left:4px solid var(--cyan)}
textarea.code{border-top:3px solid var(--cyan)}
textarea.code:focus{outline:2px solid var(--pencil);outline-offset:0;border-color:var(--pencil)}
.ed{margin:10px 0 0}
.syms{display:flex;gap:6px;overflow-x:auto;padding:0 0 7px;-webkit-overflow-scrolling:touch}
.sym{flex:none;background:var(--plan2);border:1px solid var(--line);color:var(--pencil);font:500 15px var(--fm);border-radius:2px;min-width:38px;padding:7px 9px;cursor:pointer}
.sym:active{background:var(--hover)}
.blk{margin:10px 0 18px}
.out{margin-top:10px}
.outbox{background:var(--code);border:1px solid var(--line);border-left:4px solid var(--lumber);padding:10px 14px;font:13.5px/1.55 var(--fm);white-space:pre-wrap;word-break:break-word}
.outbox .log{color:#dfe8ec}.outbox .warn{color:var(--lumber)}.outbox .error,.outbox .err{color:#ffa77a}
.outbox .hd{font:600 15px var(--fd);letter-spacing:.04em;color:var(--cyan);margin:0 0 4px}
.res{font:13.5px/1.5 var(--fm);margin:3px 0}.res.ok{color:var(--pass)}.res.no{color:#ffa77a}
.res small{display:block;color:var(--dim);font-size:12.5px;margin-left:18px;white-space:pre-wrap}
/* exercise = work order with a ruler edge, stamped when it passes */
.ex{position:relative;overflow:hidden;background:var(--plan);border:1px solid var(--line);padding:30px 16px 16px;margin:22px 0}
.ex::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;border-bottom:1px solid var(--line);background:
 repeating-linear-gradient(90deg,var(--cyan) 0 1px,transparent 1px 40px) bottom/100% 11px no-repeat,
 repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px) bottom/100% 6px no-repeat}
.ex.solved{border-color:var(--pass)}
.ex.solved::before{border-bottom-color:var(--pass)}
.ex .ttl{font:800 24px/1.05 var(--fd);letter-spacing:.01em}
.ex .prompt p{font-size:16.5px}
.stamp{position:absolute;top:30px;right:14px;font:800 22px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--pass);border:3px solid var(--pass);padding:0 10px;border-radius:3px;transform:rotate(-7deg);opacity:.92;pointer-events:none;background:rgba(11,26,40,.55)}
.stamp.pop{animation:thud .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes thud{0%{transform:rotate(-7deg) scale(2.1);opacity:0}70%{transform:rotate(-7deg) scale(.94);opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.hintbox .callout{margin-top:18px}
.lvl{font:italic 400 14.5px var(--fb);color:var(--faint)}
table.ref{width:100%;border-collapse:collapse;margin:4px 0 12px}table.ref td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15.5px;line-height:1.45}table.ref td:first-child{font-family:var(--fm);color:#ffe08a;white-space:pre-wrap;width:46%;font-size:12.5px}
/* home */
.hero h1{font-size:clamp(54px,17vw,88px);margin:0}
.hero .sub{max-width:34ch;margin:8px 0 6px;font-size:18px}
.house{display:block;width:100%;height:auto;margin:4px 0 6px;overflow:visible}
.house .plan *{fill:none;stroke:var(--cyan);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.house .built line,.house .built polyline,.house .built rect.f{stroke:var(--lumber);stroke-width:3;stroke-linecap:square;fill:none}
.house .built rect.slab{fill:#52697c;stroke:none}
.house .built rect.open{fill:var(--ink);stroke:var(--lumber);stroke-width:3}
.house .built .lit{fill:var(--pencil);opacity:0;transition:opacity 1.2s .8s}
.house.done .built .lit{opacity:.9}
.house .built .siding{fill:#173f5e;stroke:none;opacity:0;transition:opacity 1.2s}
.house.done .built .siding{opacity:1}
#reveal-rect{transition:transform 2.2s cubic-bezier(.22,.7,.2,1)}
.house text{font:italic 400 14px var(--fb);fill:var(--dim)}
.house .dim{stroke:var(--cyan);stroke-width:1;opacity:.75}
.next{display:flex;gap:14px;align-items:center;background:var(--plan);border:1px solid var(--line);border-left:6px solid var(--pencil);padding:14px 16px;margin:12px 0 6px}
.next .k{font:600 16px var(--fd);letter-spacing:.03em;color:var(--cyan)}
.next .t{font:800 24px/1.05 var(--fd)}
.stagehd{margin:38px 0 2px}
.stagenote{color:var(--dim);font-size:16px;margin:0 0 14px;max-width:44ch}
.unitrow{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:6px 8px 14px 0;cursor:pointer}
.unitrow:not(.last)::before{content:'';position:absolute;left:21px;top:50px;bottom:-4px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 16px)}
.unitrow .node{position:relative;width:44px;height:44px;border:1.5px solid var(--cyan);background:var(--plan);display:grid;place-items:center;font:800 24px var(--fd);overflow:hidden}
.unitrow .node i{position:absolute;left:0;right:0;bottom:0;background:rgba(217,164,65,.62)}
.unitrow .node span{position:relative;text-shadow:0 1px 3px rgba(7,19,30,.9)}
.unitrow.full .node{border-color:var(--lumber)}.unitrow.full .node i{background:var(--lumber)}.unitrow.full .node span{color:#1b1500;text-shadow:none}
.unitrow:hover .ut{color:var(--pencil)}
.unitrow .ut{font:800 25px/1.05 var(--fd);letter-spacing:.005em;transition:color .15s}
.unitrow .us{font-size:15px;color:var(--faint);margin-top:2px;line-height:1.35}
@media (prefers-reduced-motion:reduce){#reveal-rect,.house .built .lit,.house .built .siding{transition:none}.stamp.pop{animation:none}.btn,.card.click,.opt{transition:none}}
/* code must show the real characters: === and <= are not ligatures here */
code,textarea.code,pre,pre.static,.sym,.opt.mono,.outbox,.outbox div,.res,.res small,table.ref td:first-child{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;font-variant-ligatures:none}
.card .grow{font-family:var(--fd);font-weight:800;font-size:22px;line-height:1.1}

<script>
const DATA = {"title": "Learn to Code: JavaScript and Computer Science", "parts": [{"title": "Foundation", "note": "How code runs, then values, decisions, loops and functions. Everything else rests on this.", "units": ["u1", "u2", "u3", "u4", "u5"]}, {"title": "Framing", "note": "Arrays, objects and JSON, plus the tools that keep your code standing: map, filter, reduce and testing.", "units": ["u6", "u7", "u8", "u9"]}, {"title": "Systems", "note": "How professionals make code fast and clean: Big-O, recursion, data structures and classes.", "units": ["u10", "u11", "u12", "u13"]}, {"title": "Finish work", "note": "Async code, the web, and five complete projects to prove it.", "units": ["u14", "u15"]}], "units": [{"id": "u1", "num": 1, "title": "How Computers Run Code", "objectives": ["Explain what a processor, memory and a program do", "Convert between binary, decimal and text codes", "Run a program, read an error message, and tell the three kinds of bugs apart"], "lessons": [{"id": "u1.1", "title": "What a computer actually does", "md": "A computer is a machine that follows instructions extremely fast and extremely literally. It has four jobs: **take input**, **store data**, **process it**, and **produce output**.\n\n- The **CPU** (processor) executes tiny instructions: add two numbers, compare them, move data. It does billions per second.\n- **Memory (RAM)** holds the data and instructions a program is using right now. It is fast and wiped when power is lost.\n- **Storage** (SSD, phone flash) keeps files permanently. It is slower than RAM.\n- **Input / output**: keyboard, touchscreen, network in; screen, speakers, network out.\n\nA **program** is a list of instructions written in a language people can read. An **algorithm** is the idea behind it: a clear, step-by-step recipe that always finishes and gives the right answer. Here is an algorithm in plain English:\n\n```text\n1. Get two slices of bread.\n2. Spread peanut butter on one.\n3. Spread jelly on the other.\n4. Put the slices together.\n```\n\nComputers cannot guess. If step 2 were missing, you would get a jelly sandwich and no complaint. Programming is mostly the skill of **breaking a problem into steps precise enough that a machine cannot misunderstand them**.\n\n## Your first program\n\nYou will write **JavaScript**. It is the language of every web browser, it also runs servers (Node.js), and it is the language behind React apps. Everything in this course runs right here in the app.\n\n`console.log(...)` prints a value to the output panel. Press ▶ Run:\n\n```js\nconsole.log(\"Hello, world!\");\nconsole.log(2 + 2);\n```\n\nNow change the text inside the quotes and run it again. **Always edit the examples.** Reading code teaches you a little; changing it and predicting what happens teaches you a lot.\n\n> **How your code actually runs:** A JavaScript *engine* (V8 in Chrome and Node) reads your text, converts it to machine instructions, and the CPU executes them. You write text; the engine does the translating.", "ex": [{"id": "u1.1.1", "title": "Hello, world", "prompt": "Print exactly `Hello, world!` using `console.log`.", "starter": "// Print Hello, world! below\n", "solution": "console.log(\"Hello, world!\");\n", "tests": "test('prints Hello, world!', () => eq(logs[0], 'Hello, world!'));\ntest('prints only one line', () => eq(logs.length, 1));", "hints": ["Use `console.log(\"...\")` with the text inside quotes.", "Match the capitalization, comma and exclamation mark exactly."]}, {"id": "u1.1.2", "title": "Countdown", "prompt": "Print four lines, in this order: `3`, `2`, `1`, `Liftoff!`. Numbers do not need quotes; text does.", "starter": "// Countdown program\n", "solution": "console.log(3);\nconsole.log(2);\nconsole.log(1);\nconsole.log(\"Liftoff!\");\n", "tests": "test('prints the countdown in order', () => eq(logs, ['3', '2', '1', 'Liftoff!']));", "hints": ["One `console.log` per line.", "Text like Liftoff! needs quotes around it."]}]}, {"id": "u1.2", "title": "Bits, bytes and binary", "md": "Inside a computer everything is a pattern of **bits**. A bit is a switch that is either 0 or 1. Eight bits make a **byte**.\n\nWhy only two states? Because electronics can reliably tell \"voltage\" from \"no voltage\". Everything else (numbers, text, photos, music) is **encoded** as patterns of those switches.\n\n### Counting in binary\n\nDecimal uses ten digits and each place is worth 10 times the one to its right (ones, tens, hundreds). Binary uses two digits and each place is worth **2 times** the one to its right:\n\n```text\nplace value:   8   4   2   1\nbits:          1   0   1   0     = 8 + 2 = 10\n```\n\nWith *n* bits you can make **2ⁿ different patterns**. One byte (8 bits) gives 256 values (0 to 255). That is why colors in web pages go from 0 to 255 per channel.\n\nJavaScript can convert for you:\n\n```js\nconsole.log((10).toString(2));      // number -> binary text\nconsole.log(parseInt(\"1010\", 2));   // binary text -> number\nconsole.log((255).toString(16));    // hexadecimal (base 16)\n```\n\n### Text is numbers too\n\nEvery character has a number (its **code**). In ASCII and Unicode, `A` is 65, `B` is 66, `a` is 97. Emoji and other languages use larger Unicode codes.\n\n```js\nconsole.log(\"A\".charCodeAt(0));\nconsole.log(String.fromCharCode(97));\n```\n\n### Why decimals can be weird\n\nComputers store fractions in binary too, and some decimals (like 0.1) cannot be written exactly in binary, just as 1/3 cannot be written exactly in decimal. So:\n\n```js\nconsole.log(0.1 + 0.2);\nconsole.log(0.1 + 0.2 === 0.3);\n```\n\nThis is not a bug in JavaScript. It is how floating-point numbers work in nearly every language. When money matters, programmers store **cents as whole numbers** instead of dollars as decimals.", "ex": [{"id": "u1.2.1", "title": "Decimal to binary", "prompt": "The variable `n` holds a number. Set `asBinary` to the binary text for `n` using `toString(2)`.", "starter": "const n = 37;\nlet asBinary = null;\n// your code here\n", "solution": "const n = 37;\nlet asBinary = n.toString(2);\n", "tests": "test('asBinary is \"100101\"', () => eq(asBinary, '100101'));", "hints": ["`n.toString(2)` returns text.", "Assign it: `asBinary = n.toString(2);`"]}, {"id": "u1.2.2", "title": "Binary to decimal", "prompt": "The variable `bits` holds binary text. Set `value` to its numeric value with `parseInt(text, 2)`.", "starter": "const bits = \"11010\";\nlet value = null;\n// your code here\n", "solution": "const bits = \"11010\";\nlet value = parseInt(bits, 2);\n", "tests": "test('value is 26', () => eq(value, 26));\ntest('value is a number', () => eq(typeof value, 'number'));", "hints": ["The second argument to `parseInt` is the base."]}]}, {"id": "u1.3", "title": "Reading errors and the three kinds of bugs", "md": "A program is a list of **statements** that run **top to bottom**, one after another. Each statement ends with a semicolon `;` (JavaScript often forgives a missing one, but write them anyway). `//` starts a comment: the engine ignores it. Use comments to explain *why*, not to repeat *what*.\n\n```js\n// Statements run in order\nconsole.log(\"one\");\nconsole.log(\"two\");   // this runs second\nconsole.log(\"three\");\n```\n\nJavaScript is **case-sensitive**: `console.log` works, `Console.Log` does not. Spelling matters. Quotes and brackets must come in pairs.\n\n### The three kinds of bugs\n\n- **Syntax error**: the text is not valid JavaScript (missing quote, unmatched bracket). The program will not start at all.\n- **Runtime error**: valid text, but something fails while running (using a name that does not exist, calling something that is not a function). The program stops at that line.\n- **Logic error**: the program runs fine and prints the *wrong answer*. The computer did exactly what you said, not what you meant.\n\nLogic errors are the hardest because nothing complains. Here is a classic one, caused by **operator precedence** (multiplication and division happen before addition and subtraction, like in math class):\n\n```js\nconst average = 4 + 8 / 2;\nconsole.log(average);\n```\n\nYou wanted 6 but got 8. Parentheses fix it: `(4 + 8) / 2`.\n\n### Reading an error message\n\nErrors tell you the **type** and the **reason**. Run this one:\n\n```js throws\nconsole.log(\"start\");\nconsol.log(\"oops\");\n```\n\nRead it: `ReferenceError: consol is not defined`. \"ReferenceError\" means a name was used that does not exist; the message names the exact word. The app also shows the **line number**. Start debugging by reading the message literally. Most beginners skim it, then guess.", "ex": [{"id": "u1.3.1", "title": "Fix the broken program", "prompt": "This program should print `Total: 15` and then `Done`. It has **two bugs**: one syntax error and one runtime error. Fix both. Read the error message after each run.", "starter": "const a = 5;\nconst b = 10;\nconst total = a + b;\nconsole.log(\"Total: + total);\nConsole.log(\"Done\");\n", "solution": "const a = 5;\nconst b = 10;\nconst total = a + b;\nconsole.log(\"Total: \" + total);\nconsole.log(\"Done\");\n", "tests": "test('prints the right two lines', () => eq(logs, ['Total: 15', 'Done']));", "hints": ["The first string is missing its closing quote.", "JavaScript is case-sensitive: `console` starts with a lowercase c."]}, {"id": "u1.3.2", "title": "Fix the logic error", "prompt": "`average` should be the average of 4 and 8 (which is 6) but the program is wrong. Fix the line without changing the numbers.", "starter": "const average = 4 + 8 / 2;\nconsole.log(average);\n", "solution": "const average = (4 + 8) / 2;\nconsole.log(average);\n", "tests": "test('average is 6', () => eq(average, 6));\ntest('prints 6', () => eq(logs, ['6']));", "hints": ["Division happens before addition.", "Parentheses force the addition to happen first."]}]}], "quiz": [{"id": "u1-q1", "q": "How many different values can one byte (8 bits) represent?", "code": null, "o": ["256", "8", "64", "128"], "a": 0, "why": "Each bit doubles the possibilities: 2 to the 8th power is 256.", "mono": false}, {"id": "u1-q2", "q": "What is the binary number 1010 in decimal?", "code": null, "o": ["10", "8", "12", "5"], "a": 0, "why": "Place values 8, 4, 2, 1: 8 + 2 = 10.", "mono": false}, {"id": "u1-q3", "q": "Which part of a computer executes program instructions?", "code": null, "o": ["The CPU", "The SSD", "The monitor", "The keyboard"], "a": 0, "why": "The CPU performs the instructions. Storage keeps data, and the screen and keyboard are I/O devices.", "mono": false}, {"id": "u1-q4", "q": "Your program runs without errors but prints the wrong answer. This is a:", "code": null, "o": ["Logic error", "Syntax error", "Runtime error", "Compile error"], "a": 0, "why": "Valid code that does the wrong thing is a logic error. The computer did exactly what you said.", "mono": false}, {"id": "u1-q5", "q": "A syntax error means:", "code": null, "o": ["The code is not valid JavaScript, so it will not start", "The program crashes halfway through", "The answer is wrong", "The computer is out of memory"], "a": 0, "why": "The engine cannot even parse the text, so nothing runs.", "mono": false}, {"id": "u1-q6", "q": "What is an algorithm?", "code": null, "o": ["A precise step-by-step procedure that solves a problem", "A programming language", "A kind of computer chip", "A bug in a program"], "a": 0, "why": "An algorithm is the recipe. A program is one way to write it down for a machine.", "mono": false}, {"id": "u1-q7", "q": "What does this code print?", "code": "console.log(3 + 4 * 2);", "o": ["11", "14", "24", "9"], "a": 0, "why": "Multiplication happens before addition: 4 * 2 = 8, then 3 + 8 = 11.", "mono": true}, {"id": "u1-q8", "q": "What does this code print?", "code": "console.log(0.1 + 0.2 === 0.3);", "o": ["false", "true", "0.3", "undefined"], "a": 0, "why": "Binary floating point cannot store 0.1 exactly, so the sum is 0.30000000000000004, which is not equal to 0.3.", "mono": true}]}, {"id": "u2", "num": 2, "title": "Values, Variables & Your First Functions", "objectives": ["Use numbers, strings and booleans and know which is which", "Store values in variables with let and const", "Write functions that take input and return output"], "lessons": [{"id": "u2.1", "title": "Values, types and variables", "md": "Every value in JavaScript has a **type**. The ones you need first:\n\n- **number**: `42`, `3.14`, `-7` (integers and decimals are the same type)\n- **string**: text in quotes: `\"hello\"` or `'hello'`\n- **boolean**: `true` or `false`\n- **undefined**: \"no value has been given\"\n- **null**: \"deliberately empty\"\n\n`typeof` tells you the type:\n\n```js\nconsole.log(typeof 42);\nconsole.log(typeof \"42\");\nconsole.log(typeof true);\nconsole.log(typeof undefined);\n```\n\n`42` and `\"42\"` look alike but behave differently. This is the source of many beginner bugs.\n\n### Variables\n\nA **variable** is a named box that holds a value. Create one with `let` (value can change) or `const` (value cannot be reassigned):\n\n```js\nconst city = \"Biloxi\";     // will never change\nlet visitors = 100;         // will change\nvisitors = visitors + 25;\nconsole.log(city, visitors);\n```\n\nRules of thumb:\n\n- Use **`const`** by default. Switch to `let` only when you need to reassign.\n- Names are **camelCase**: `totalPrice`, `isLoggedIn`. Start with a letter. No spaces.\n- A good name says what the value *means*: `secondsPerDay` beats `x`.\n- `=` means **assign** (\"put the right side into the left name\"). It is not math equality.\n\nTrying to reassign a `const` is a runtime error:\n\n```js throws\nconst rate = 0.07;\nrate = 0.08;\n```\n\n> **Swap trick:** to swap two variables you need a third, temporary one. Otherwise you overwrite a value before you have saved it.", "ex": [{"id": "u2.1.1", "title": "Three kinds of values", "prompt": "Create three variables with these exact names: `city` (a string), `population` (a number) and `isCoastal` (a boolean). Pick any values you like.", "starter": "// declare city, population and isCoastal\n", "solution": "const city = \"Gulfport\";\nconst population = 72000;\nconst isCoastal = true;\n", "tests": "test('city is a string', () => eq(typeof city, 'string'));\ntest('population is a number', () => eq(typeof population, 'number'));\ntest('isCoastal is a boolean', () => eq(typeof isCoastal, 'boolean'));", "hints": ["Example: `const city = \"Gulfport\";`", "Booleans are written without quotes: `true`."]}, {"id": "u2.1.2", "title": "Swap two variables", "prompt": "Swap the values of `a` and `b` so that `a` is 2 and `b` is 1. Use a temporary variable.", "starter": "let a = 1;\nlet b = 2;\n// swap them\n", "solution": "let a = 1;\nlet b = 2;\nconst temp = a;\na = b;\nb = temp;\n", "tests": "test('a is 2', () => eq(a, 2));\ntest('b is 1', () => eq(b, 1));", "hints": ["Save `a` into a third variable first.", "Order: temp = a; a = b; b = temp;"]}]}, {"id": "u2.2", "title": "Numbers and operators", "md": "Arithmetic operators: `+ - * /` as expected. Two more you will use constantly:\n\n- `%` **remainder**: `17 % 5` is 2 (17 = 3×5 + 2). Great for \"is it even?\" and wrapping around.\n- `**` **power**: `2 ** 10` is 1024.\n\n```js\nconsole.log(7 / 2);        // not integer division!\nconsole.log(17 % 5);\nconsole.log(2 ** 10);\nconsole.log(10 % 2 === 0); // is 10 even?\n```\n\n`Math` has helpers:\n\n```js\nconsole.log(Math.floor(3.9));   // 3  (round down)\nconsole.log(Math.ceil(3.1));    // 4  (round up)\nconsole.log(Math.round(3.5));   // 4\nconsole.log(Math.max(4, 9, 2)); // 9\nconsole.log(Math.abs(-5));      // 5\n```\n\nThere is no separate integer division, so you combine `/` and `Math.floor`. **Shortcuts** update a variable in place:\n\n```js\nlet score = 10;\nscore += 5;   // score = score + 5\nscore *= 2;\nscore++;      // add 1\nconsole.log(score);\n```\n\n### Number formatting\n\n`toFixed(2)` rounds to 2 decimals but returns **text**:\n\n```js\nconst price = 19.999;\nconsole.log(price.toFixed(2));\nconsole.log(typeof price.toFixed(2));\n```\n\nOperator **precedence**: `**` first, then `* / %`, then `+ -`. When unsure, add parentheses. They cost nothing and make intent clear.", "ex": [{"id": "u2.2.1", "title": "Tip calculator", "prompt": "`bill` is 80 and `tipPercent` is 18. Calculate `tip` (the tip amount) and `total` (bill plus tip).", "starter": "const bill = 80;\nconst tipPercent = 18;\nlet tip = 0;\nlet total = 0;\n// calculate tip and total\n", "solution": "const bill = 80;\nconst tipPercent = 18;\nlet tip = bill * tipPercent / 100;\nlet total = bill + tip;\n", "tests": "test('tip is 14.40', () => approx(tip, 14.4));\ntest('total is 94.40', () => approx(total, 94.4));", "hints": ["A percent is a number divided by 100.", "total = bill + tip"]}, {"id": "u2.2.2", "title": "Hours and minutes", "prompt": "`totalMinutes` is 135. Set `hours` to the whole hours and `minutes` to the minutes left over. (135 minutes is 2 hours 15 minutes.)", "starter": "const totalMinutes = 135;\nlet hours = 0;\nlet minutes = 0;\n// calculate hours and minutes\n", "solution": "const totalMinutes = 135;\nlet hours = Math.floor(totalMinutes / 60);\nlet minutes = totalMinutes % 60;\n", "tests": "test('hours is 2', () => eq(hours, 2));\ntest('minutes is 15', () => eq(minutes, 15));", "hints": ["Divide by 60 and round down for hours.", "`%` gives the remainder."]}]}, {"id": "u2.3", "title": "Strings", "md": "A string is text. Join strings with `+` (**concatenation**) or, better, put values inside a **template literal** with backticks and `${...}`:\n\n```js\nconst name = \"Sam\";\nconst items = 3;\nconsole.log(\"Hello, \" + name + \"! You have \" + items + \" items.\");\nconsole.log(`Hello, ${name}! You have ${items} items.`);\nconsole.log(`Total: ${items * 4.5}`);   // any expression works inside ${}\n```\n\nBeware `+` with mixed types. If either side is a string, it joins instead of adds:\n\n```js\nconsole.log(\"5\" + 3);\nconsole.log(\"5\" - 3);\nconsole.log(5 + 3);\n```\n\n### Useful string tools\n\n```js\nconst s = \"  Mississippi Gulf Coast  \";\nconsole.log(s.length);\nconsole.log(s.trim());                 // remove outer spaces\nconsole.log(s.trim().toUpperCase());\nconsole.log(s.trim().toLowerCase());\nconsole.log(\"Gulf\".length);\nconsole.log(\"hello\"[0]);               // first character, index starts at 0\nconsole.log(\"hello\".slice(1, 3));      // from index 1 up to (not including) 3\nconsole.log(\"a,b,c\".split(\",\"));       // string -> array\nconsole.log(\"hello\".includes(\"ell\"));\nconsole.log(\"hello\".indexOf(\"l\"));     // -1 if not found\nconsole.log(\"go\".repeat(3));\nconsole.log(\"banana\".replaceAll(\"a\", \"o\"));\n```\n\nStrings are **immutable**: methods never change the original, they **return a new string**. If you want to keep the result, store it:\n\n```js\nlet word = \"hello\";\nword.toUpperCase();          // result thrown away\nconsole.log(word);\nword = word.toUpperCase();   // keep it\nconsole.log(word);\n```\n\nIndexes start at **0**. The last character of `s` is `s[s.length - 1]`. Escape special characters with a backslash: `\"She said \\\"hi\\\"\"` and `\\n` for a new line.", "ex": [{"id": "u2.3.1", "title": "Build a message", "prompt": "Using a template literal, set `message` to `Sam has 3 items in the cart.` using the variables `user` and `items`.", "starter": "const user = \"Sam\";\nconst items = 3;\nlet message = \"\";\n// build the message\n", "solution": "const user = \"Sam\";\nconst items = 3;\nlet message = `${user} has ${items} items in the cart.`;\n", "tests": "test('message is correct', () => eq(message, 'Sam has 3 items in the cart.'));", "hints": ["Backticks, then `${user}` and `${items}` inside the text."]}, {"id": "u2.3.2", "title": "Clean an email", "prompt": "`rawEmail` has stray spaces and capital letters. Set `cleanEmail` to the trimmed, lowercase version, and `domain` to the part after the `@`.", "starter": "const rawEmail = \"  Anthony@Example.COM \";\nlet cleanEmail = \"\";\nlet domain = \"\";\n// clean it up\n", "solution": "const rawEmail = \"  Anthony@Example.COM \";\nlet cleanEmail = rawEmail.trim().toLowerCase();\nlet domain = cleanEmail.split(\"@\")[1];\n", "tests": "test('cleanEmail', () => eq(cleanEmail, 'anthony@example.com'));\ntest('domain', () => eq(domain, 'example.com'));", "hints": ["Chain methods: `rawEmail.trim().toLowerCase()`.", "`split(\"@\")` gives an array of two pieces."]}]}, {"id": "u2.4", "title": "Functions: reusable recipes", "md": "A **function** is a named recipe. You give it **inputs** (parameters), it does work, and it hands back an **output** with `return`.\n\n```js\nfunction square(n) {\n  return n * n;\n}\n\nconsole.log(square(5));\nconsole.log(square(12));\n```\n\n- `function square(n)` **declares** the function. `n` is a **parameter**: a placeholder for whatever value gets passed in.\n- `square(5)` **calls** it. `5` is the **argument**.\n- `return` sends a value back to the caller and **ends the function**.\n\nFunctions with several parameters:\n\n```js\nfunction areaOfRectangle(width, height) {\n  return width * height;\n}\nconsole.log(areaOfRectangle(4, 6));\n```\n\n### return vs console.log\n\nThis is the most common beginner confusion. `console.log` **prints** for a human. `return` **gives a value back** to your code so it can be used again:\n\n```js\nfunction addOne(n) {\n  return n + 1;\n}\nconst result = addOne(addOne(5));   // use the output as an input\nconsole.log(result);\n```\n\nA function with no `return` gives back `undefined`:\n\n```js\nfunction broken(n) {\n  n + 1;          // computed and thrown away\n}\nconsole.log(broken(5));\n```\n\n### Why functions matter\n\n1. **Reuse**: write it once, use it anywhere.\n2. **Names**: `calculateTax(price)` explains itself.\n3. **Testing**: you can check a function by feeding it inputs. That is how the exercises in this course grade your code.\n\nThe next unit covers functions in more depth (scope, arrow functions, defaults). Here, practice the shape: **input in, output returned**.", "ex": [{"id": "u2.4.1", "title": "Rectangle area", "prompt": "Write a function `area(width, height)` that **returns** the area of a rectangle.", "starter": "// write area here\n", "solution": "function area(width, height) {\n  return width * height;\n}\n", "tests": "test('area(4, 6) is 24', () => eq(area(4, 6), 24));\ntest('area(2.5, 2) is 5', () => eq(area(2.5, 2), 5));\ntest('area(0, 9) is 0', () => eq(area(0, 9), 0));", "hints": ["`function area(width, height) { ... }`", "Use `return`, not `console.log`."]}, {"id": "u2.4.2", "title": "Fahrenheit to Celsius", "prompt": "Write `toCelsius(f)` that converts Fahrenheit to Celsius. Formula: `(f - 32) * 5 / 9`.", "starter": "// write toCelsius here\n", "solution": "function toCelsius(f) {\n  return (f - 32) * 5 / 9;\n}\n", "tests": "test('32F is 0C', () => approx(toCelsius(32), 0));\ntest('212F is 100C', () => approx(toCelsius(212), 100));\ntest('98.6F is about 37C', () => approx(toCelsius(98.6), 37, 0.001));", "hints": ["Parentheses around `f - 32` matter."]}, {"id": "u2.4.3", "title": "Initials", "prompt": "Write `initials(first, last)` that returns the two initials in capitals with periods. `initials(\"anthony\", \"anderson\")` should return `\"A.A.\"`.", "starter": "// write initials here\n", "solution": "function initials(first, last) {\n  return first[0].toUpperCase() + \".\" + last[0].toUpperCase() + \".\";\n}\n", "tests": "test('A.A.', () => eq(initials('anthony', 'anderson'), 'A.A.'));\ntest('J.S.', () => eq(initials('jane', 'Smith'), 'J.S.'));", "hints": ["`first[0]` is the first character.", "Strings have `toUpperCase()`."]}]}], "quiz": [{"id": "u2-q1", "q": "What does this code print?", "code": "console.log(typeof \"42\");", "o": ["string", "number", "string42", "undefined"], "a": 0, "why": "Anything in quotes is a string, even if it looks like a number.", "mono": true}, {"id": "u2-q2", "q": "What does this code print?", "code": "console.log(\"5\" + 3);", "o": ["53", "8", "2", "\"53\""], "a": 0, "why": "When one side is a string, + joins text, so you get the text 53.", "mono": true}, {"id": "u2-q3", "q": "What does this code print?", "code": "console.log(\"5\" - 3);", "o": ["2", "53", "NaN", "8"], "a": 0, "why": "Minus only works on numbers, so JavaScript converts \"5\" to 5 and computes 2.", "mono": true}, {"id": "u2-q4", "q": "What does this code print?", "code": "console.log(17 % 5, 2 ** 3);", "o": ["2 8", "3 6", "2 8 ", "3 8"], "a": 0, "why": "The remainder of 17 / 5 is 2, and 2 to the 3rd power is 8.", "mono": true}, {"id": "u2-q5", "q": "What does this code print?", "code": "console.log(7 / 2, Math.floor(7 / 2));", "o": ["3.5 3", "3 3", "3.5 4", "4 3"], "a": 0, "why": "7 / 2 is 3.5. Math.floor rounds down to 3.", "mono": true}, {"id": "u2-q6", "q": "What does this code print?", "code": "const n = \"go\";\nconsole.log(`${n}! `.repeat(2));", "o": ["go! go! ", "go!go!", "go! ", "go!! "], "a": 0, "why": "The template literal makes \"go! \" and repeat(2) doubles it, ending with a trailing space.", "mono": true}, {"id": "u2-q7", "q": "What does this code print?", "code": "let word = \"hello\";\nword.toUpperCase();\nconsole.log(word);", "o": ["hello", "HELLO", "undefined", "Hello"], "a": 0, "why": "Strings are immutable: toUpperCase returns a new string, and the result was never stored.", "mono": true}, {"id": "u2-q8", "q": "What does this code print?", "code": "function addOne(n) {\n  n + 1;\n}\nconsole.log(addOne(5));", "o": ["undefined", "6", "null", "NaN"], "a": 0, "why": "The function has no return statement, so it gives back undefined.", "mono": true}, {"id": "u2-q9", "q": "Which keyword should you use for a variable whose value will never be reassigned?", "code": null, "o": ["const", "let", "var", "static"], "a": 0, "why": "`const` prevents reassignment and signals your intent. Use `let` only when the value must change.", "mono": false}]}, {"id": "u3", "num": 3, "title": "Making Decisions", "objectives": ["Combine comparisons and logical operators into conditions", "Branch with if, else if, else and switch", "Use truthy/falsy values, the ternary operator and default values safely"], "lessons": [{"id": "u3.1", "title": "Booleans and comparisons", "md": "A **boolean** is `true` or `false`. Comparison operators produce booleans:\n\n```js\nconsole.log(5 > 3);      // greater than\nconsole.log(5 <= 5);     // less than or equal\nconsole.log(5 === 5);    // strictly equal\nconsole.log(5 !== 4);    // not equal\nconsole.log(\"a\" === \"A\");\n```\n\n### Use `===`, not `==`\n\n`===` compares value **and** type. `==` tries to convert types first and produces surprises:\n\n```js\nconsole.log(0 == \"\");\nconsole.log(\"5\" == 5);\nconsole.log(\"5\" === 5);\n```\n\nAlways use `===` and `!==`. You will almost never need the loose versions.\n\n### Logical operators\n\nCombine booleans:\n\n- `&&` (**and**): true only if **both** sides are true\n- `||` (**or**): true if **at least one** side is true\n- `!` (**not**): flips true/false\n\n```js\nconst age = 20;\nconst hasTicket = true;\nconsole.log(age >= 18 && hasTicket);\nconsole.log(age < 13 || age > 65);\nconsole.log(!hasTicket);\n```\n\n### Ranges\n\n\"Is `x` between 1 and 10?\" is **two** comparisons joined by `&&`. Math notation `1 < x < 10` does not work the way you expect in JavaScript:\n\n```js\nconst x = 15;\nconsole.log(1 < x && x < 10);\nconsole.log(1 < x < 10);   // a classic trap. Why is this true?\n```\n\n(`1 < 15` is `true`, then `true < 10` becomes `1 < 10`, which is `true`.)\n\n### Short-circuiting\n\n`&&` and `||` stop as soon as the answer is known. In `a && b`, if `a` is false, `b` is never evaluated. This is useful and also a source of subtle bugs, so keep conditions simple.", "ex": [{"id": "u3.1.1", "title": "Even or odd", "prompt": "Write `isEven(n)` that returns `true` when `n` is even and `false` otherwise.", "starter": "// write isEven here\n", "solution": "function isEven(n) {\n  return n % 2 === 0;\n}\n", "tests": "test('isEven(4)', () => eq(isEven(4), true));\ntest('isEven(7)', () => eq(isEven(7), false));\ntest('isEven(0)', () => eq(isEven(0), true));\ntest('isEven(-3)', () => eq(isEven(-3), false));", "hints": ["The remainder when dividing by 2 is 0 for even numbers.", "You can `return` a comparison directly. It is already a boolean."]}, {"id": "u3.1.2", "title": "In range", "prompt": "Write `inRange(n, low, high)` that returns `true` if `n` is between `low` and `high` **inclusive**.", "starter": "// write inRange here\n", "solution": "function inRange(n, low, high) {\n  return n >= low && n <= high;\n}\n", "tests": "test('middle', () => eq(inRange(5, 1, 10), true));\ntest('low edge', () => eq(inRange(1, 1, 10), true));\ntest('high edge', () => eq(inRange(10, 1, 10), true));\ntest('below', () => eq(inRange(0, 1, 10), false));\ntest('above', () => eq(inRange(11, 1, 10), false));", "hints": ["Two comparisons joined with `&&`.", "Inclusive means `>=` and `<=`."]}]}, {"id": "u3.2", "title": "if, else if, else", "md": "`if` runs a block only when its condition is true. Add `else` for the other case, and `else if` for more:\n\n```js\nfunction describeTemp(t) {\n  if (t >= 90) {\n    return \"hot\";\n  } else if (t >= 70) {\n    return \"warm\";\n  } else if (t >= 50) {\n    return \"mild\";\n  } else {\n    return \"cold\";\n  }\n}\nconsole.log(describeTemp(95), describeTemp(72), describeTemp(10));\n```\n\n**Order matters.** Conditions are checked top to bottom and the **first match wins**. If you checked `t >= 50` first, every warm and hot day would be called \"mild\".\n\n### Guard clauses\n\nBecause `return` ends a function, you can handle special cases first and keep the main logic flat:\n\n```js\nfunction safeDivide(a, b) {\n  if (b === 0) {\n    return \"cannot divide by zero\";\n  }\n  return a / b;\n}\nconsole.log(safeDivide(10, 2));\nconsole.log(safeDivide(1, 0));\n```\n\nThis reads better than wrapping everything in an `else`.\n\n### Nesting vs. combining\n\nThese two do the same thing. Prefer the flatter version:\n\n```js\nconst age = 25, member = true;\nif (age >= 18) {\n  if (member) console.log(\"welcome\");\n}\nif (age >= 18 && member) console.log(\"welcome\");\n```\n\n### Common mistakes\n\n- Using `=` (assignment) where you meant `===` (comparison).\n- Forgetting that an `if` with no braces only controls **one** statement. Always use braces.\n- Checking a broad condition before a specific one.", "ex": [{"id": "u3.2.1", "title": "Letter grades", "prompt": "Write `grade(score)` returning `\"A\"` for 90 and above, `\"B\"` for 80–89, `\"C\"` for 70–79, `\"D\"` for 60–69 and `\"F\"` below 60.", "starter": "// write grade here\n", "solution": "function grade(score) {\n  if (score >= 90) return \"A\";\n  if (score >= 80) return \"B\";\n  if (score >= 70) return \"C\";\n  if (score >= 60) return \"D\";\n  return \"F\";\n}\n", "tests": "test('95 is A', () => eq(grade(95), 'A'));\ntest('90 is A', () => eq(grade(90), 'A'));\ntest('89 is B', () => eq(grade(89), 'B'));\ntest('75 is C', () => eq(grade(75), 'C'));\ntest('60 is D', () => eq(grade(60), 'D'));\ntest('59 is F', () => eq(grade(59), 'F'));\ntest('0 is F', () => eq(grade(0), 'F'));", "hints": ["Check from the highest grade down so the first match wins.", "Each `return` ends the function, so you do not need `else`."]}, {"id": "u3.2.2", "title": "Classify a triangle", "prompt": "Write `triangleType(a, b, c)`. Return `\"invalid\"` if any side is 0 or negative, or if the two shorter sides do not add up to **more than** the longest side. Otherwise return `\"equilateral\"` (all equal), `\"isosceles\"` (exactly two equal) or `\"scalene\"` (none equal).", "starter": "// write triangleType here\n", "solution": "function triangleType(a, b, c) {\n  if (a <= 0 || b <= 0 || c <= 0) return \"invalid\";\n  const longest = Math.max(a, b, c);\n  const others = a + b + c - longest;\n  if (others <= longest) return \"invalid\";\n  if (a === b && b === c) return \"equilateral\";\n  if (a === b || b === c || a === c) return \"isosceles\";\n  return \"scalene\";\n}\n", "tests": "test('equilateral', () => eq(triangleType(3, 3, 3), 'equilateral'));\ntest('isosceles', () => eq(triangleType(5, 5, 8), 'isosceles'));\ntest('isosceles order', () => eq(triangleType(5, 8, 5), 'isosceles'));\ntest('scalene', () => eq(triangleType(3, 4, 5), 'scalene'));\ntest('invalid zero', () => eq(triangleType(0, 4, 5), 'invalid'));\ntest('invalid too long', () => eq(triangleType(1, 2, 10), 'invalid'));\ntest('degenerate', () => eq(triangleType(1, 2, 3), 'invalid'));", "hints": ["Handle the invalid cases first (guard clauses).", "`Math.max(a, b, c)` finds the longest side."]}]}, {"id": "u3.3", "title": "Truthy, ternary and switch", "md": "JavaScript will treat **any value** as true or false when a condition needs a boolean. These are **falsy**: `false`, `0`, `\"\"` (empty string), `null`, `undefined`, `NaN`. **Everything else is truthy**, including `\"0\"`, `\"false\"` and (later) empty arrays.\n\n```js\nif (\"hello\") console.log(\"non-empty strings are truthy\");\nif (!\"\") console.log(\"empty string is falsy\");\nif (0) console.log(\"never prints\");\n```\n\n### Default values\n\n`||` returns the first truthy value, which makes it a quick default. But it also replaces legitimate `0` and `\"\"`. The **nullish** operator `??` only replaces `null` and `undefined`:\n\n```js\nconst count = 0;\nconsole.log(count || 10);   // 0 is falsy, so we get 10 (probably a bug)\nconsole.log(count ?? 10);   // 0 is kept\nconsole.log(undefined ?? \"default\");\n```\n\n### Ternary operator\n\n`condition ? valueIfTrue : valueIfFalse` is an `if/else` that **produces a value**:\n\n```js\nconst age = 20;\nconst label = age >= 18 ? \"adult\" : \"minor\";\nconsole.log(label);\n```\n\nUse it for simple choices. If you need to nest ternaries, use `if` instead.\n\n### switch\n\nWhen you compare **one value** against many exact options, `switch` reads cleanly. `break` stops execution from \"falling through\" to the next case:\n\n```js\nfunction dayType(day) {\n  switch (day) {\n    case \"sat\":\n    case \"sun\":\n      return \"weekend\";\n    case \"fri\":\n      return \"almost weekend\";\n    default:\n      return \"weekday\";\n  }\n}\nconsole.log(dayType(\"sun\"), dayType(\"fri\"), dayType(\"tue\"));\n```\n\n(Inside a function, `return` also exits the switch, so `break` is not needed there.)", "ex": [{"id": "u3.3.1", "title": "Display name", "prompt": "Write `displayName(name)` that returns `name` if it is a non-empty string, otherwise returns `\"Guest\"`.", "starter": "// write displayName here\n", "solution": "function displayName(name) {\n  return name || \"Guest\";\n}\n", "tests": "test('keeps a name', () => eq(displayName('Sam'), 'Sam'));\ntest('empty string', () => eq(displayName(''), 'Guest'));\ntest('undefined', () => eq(displayName(undefined), 'Guest'));\ntest('null', () => eq(displayName(null), 'Guest'));", "hints": ["An empty string is falsy.", "`name || \"Guest\"` returns the first truthy value."]}, {"id": "u3.3.2", "title": "Days in a month", "prompt": "Write `daysInMonth(month)` (1 to 12, ignore leap years: February has 28). Use a `switch`. Return 30 for April, June, September, November; 28 for February; otherwise 31.", "starter": "// write daysInMonth here\n", "solution": "function daysInMonth(month) {\n  switch (month) {\n    case 4:\n    case 6:\n    case 9:\n    case 11:\n      return 30;\n    case 2:\n      return 28;\n    default:\n      return 31;\n  }\n}\n", "tests": "test('January', () => eq(daysInMonth(1), 31));\ntest('February', () => eq(daysInMonth(2), 28));\ntest('April', () => eq(daysInMonth(4), 30));\ntest('September', () => eq(daysInMonth(9), 30));\ntest('December', () => eq(daysInMonth(12), 31));", "hints": ["Stack several `case` labels to share one result.", "Use `default` for everything else."]}]}], "quiz": [{"id": "u3-q1", "q": "What does this code print?", "code": "console.log(5 === \"5\", 5 == \"5\");", "o": ["false true", "true true", "true false", "false false"], "a": 0, "why": "Strict equality compares types too, so number 5 is not string \"5\". Loose equality converts the string first.", "mono": true}, {"id": "u3-q2", "q": "What does this code print?", "code": "console.log(1 < 15 && 15 < 10);", "o": ["false", "true", "15", "undefined"], "a": 0, "why": "The second comparison is false, so the whole && is false.", "mono": true}, {"id": "u3-q3", "q": "What does this code print?", "code": "console.log(0 || 10, 0 ?? 10);", "o": ["10 0", "0 10", "10 10", "0 0"], "a": 0, "why": "|| replaces any falsy value, including 0. ?? only replaces null and undefined.", "mono": true}, {"id": "u3-q4", "q": "What does this code print?", "code": "const n = 7;\nconsole.log(n % 2 === 0 ? \"even\" : \"odd\");", "o": ["odd", "even", "1", "7"], "a": 0, "why": "7 % 2 is 1, so the condition is false and the ternary picks \"odd\".", "mono": true}, {"id": "u3-q5", "q": "What does this code print?", "code": "function f(x) {\n  if (x > 5) return \"big\";\n  if (x > 0) return \"small\";\n  return \"none\";\n}\nconsole.log(f(10), f(3), f(-1));", "o": ["big small none", "big big none", "small small none", "none none none"], "a": 0, "why": "Each return ends the function at the first matching condition.", "mono": true}, {"id": "u3-q6", "q": "What does this code print?", "code": "console.log(!!\"hello\", !!\"\", !!0, !!\"0\");", "o": ["true false false true", "true true false false", "true false true true", "false false false true"], "a": 0, "why": "Only non-empty strings are truthy: \"0\" is a non-empty string, so it is truthy.", "mono": true}, {"id": "u3-q7", "q": "Which operator should you normally use to compare two values?", "code": null, "o": ["===", "=", "==", "=>"], "a": 0, "why": "`=` assigns, `==` converts types first, and `=>` is for arrow functions. `===` is the safe comparison.", "mono": false}, {"id": "u3-q8", "q": "In an if / else if chain, when does the first true condition stop the others?", "code": null, "o": ["The remaining branches are skipped", "All branches still run", "Only the else runs", "It causes an error"], "a": 0, "why": "Once a branch matches, JavaScript skips the rest of the chain.", "mono": false}]}, {"id": "u4", "num": 4, "title": "Loops", "objectives": ["Repeat work with while, for and for...of loops", "Use the accumulator, counter and search patterns", "Spot and avoid infinite loops and off-by-one errors"], "lessons": [{"id": "u4.1", "title": "while and for", "md": "A **loop** repeats a block of code. Computers are good at repetition, so loops are everywhere.\n\n### while\n\n`while (condition) { ... }` repeats as long as the condition stays true:\n\n```js\nlet n = 3;\nwhile (n > 0) {\n  console.log(n);\n  n = n - 1;\n}\nconsole.log(\"Liftoff!\");\n```\n\nEvery loop needs three things: a **starting state**, a **condition** to keep going, and a **change** that eventually makes the condition false. If the change is missing, the loop never ends (an **infinite loop**). The app stops runaway programs after 5 seconds.\n\n### for\n\nWhen you know how many times to repeat, `for` packs those three parts into one line: `for (start; condition; step)`:\n\n```js\nfor (let i = 1; i <= 5; i++) {\n  console.log(i);\n}\n```\n\nRead it as: start `i` at 1; while `i <= 5`; after each pass do `i++` (add one).\n\n### The accumulator pattern\n\nMost loops **build up an answer** in a variable created before the loop:\n\n```js\nlet total = 0;\nfor (let i = 1; i <= 10; i++) {\n  total += i;\n}\nconsole.log(total);\n```\n\n### Off-by-one errors\n\nCounting is where bugs hide. `i < 5` runs 5 times starting at 0 (0,1,2,3,4); `i <= 5` runs 6 times. When a loop does one too many or too few passes, check `<` vs `<=` and where you start.\n\n```js\nfor (let i = 0; i < 3; i++) console.log(\"i is\", i);\n```\n\nYou can count down or skip: `i--`, `i += 2`.", "ex": [{"id": "u4.1.1", "title": "Sum to n", "prompt": "Write `sumTo(n)` returning 1 + 2 + ... + n. `sumTo(5)` is 15. `sumTo(0)` is 0.", "starter": "// write sumTo here\n", "solution": "function sumTo(n) {\n  let total = 0;\n  for (let i = 1; i <= n; i++) {\n    total += i;\n  }\n  return total;\n}\n", "tests": "test('sumTo(5)', () => eq(sumTo(5), 15));\ntest('sumTo(1)', () => eq(sumTo(1), 1));\ntest('sumTo(0)', () => eq(sumTo(0), 0));\ntest('sumTo(100)', () => eq(sumTo(100), 5050));", "hints": ["Create `let total = 0` before the loop.", "Loop `i` from 1 to `n` inclusive."]}, {"id": "u4.1.2", "title": "Factorial", "prompt": "Write `factorial(n)`: the product 1 × 2 × ... × n. `factorial(5)` is 120. By definition `factorial(0)` is 1.", "starter": "// write factorial here\n", "solution": "function factorial(n) {\n  let result = 1;\n  for (let i = 2; i <= n; i++) {\n    result *= i;\n  }\n  return result;\n}\n", "tests": "test('factorial(5)', () => eq(factorial(5), 120));\ntest('factorial(1)', () => eq(factorial(1), 1));\ntest('factorial(0)', () => eq(factorial(0), 1));\ntest('factorial(10)', () => eq(factorial(10), 3628800));", "hints": ["An accumulator for a product should start at 1, not 0."]}]}, {"id": "u4.2", "title": "for...of and nested loops", "md": "`for...of` walks through the items of something you can iterate, such as a string, with no counters to manage:\n\n```js\nfor (const letter of \"code\") {\n  console.log(letter);\n}\n```\n\nTo count something, combine `for...of` with a counter and an `if`:\n\n```js\nlet vowels = 0;\nfor (const ch of \"mississippi\") {\n  if (ch === \"i\") vowels++;\n}\nconsole.log(vowels);\n```\n\n### Building a string\n\nYou can also accumulate text. This reverses a word by adding each new letter to the **front**:\n\n```js\nlet reversed = \"\";\nfor (const ch of \"stressed\") {\n  reversed = ch + reversed;\n}\nconsole.log(reversed);\n```\n\n### Nested loops\n\nA loop inside a loop runs the inner loop completely for **each** pass of the outer one. Think of rows and columns:\n\n```js\nfor (let row = 1; row <= 3; row++) {\n  let line = \"\";\n  for (let col = 1; col <= row; col++) {\n    line += \"*\";\n  }\n  console.log(line);\n}\n```\n\nIf the outer loop runs 3 times and the inner runs 4 times, the inner body executes **12** times. That multiplication matters later when we study how fast programs run.", "ex": [{"id": "u4.2.1", "title": "Count vowels", "prompt": "Write `countVowels(text)` that returns how many of the letters `a e i o u` appear in `text` (case-insensitive).", "starter": "// write countVowels here\n", "solution": "function countVowels(text) {\n  let count = 0;\n  for (const ch of text.toLowerCase()) {\n    if (\"aeiou\".includes(ch)) count++;\n  }\n  return count;\n}\n", "tests": "test('hello', () => eq(countVowels('hello'), 2));\ntest('uppercase', () => eq(countVowels('AEIOU'), 5));\ntest('none', () => eq(countVowels('rhythm'), 0));\ntest('empty', () => eq(countVowels(''), 0));\ntest('sentence', () => eq(countVowels('Mississippi Gulf Coast'), 7));", "hints": ["Lowercase the text first so you only compare against lowercase letters.", "`\"aeiou\".includes(ch)` checks membership."]}, {"id": "u4.2.2", "title": "Reverse a string", "prompt": "Write `reverse(text)` that returns the text backwards. Use a loop, not a built-in array trick.", "starter": "// write reverse here\n", "solution": "function reverse(text) {\n  let result = \"\";\n  for (const ch of text) {\n    result = ch + result;\n  }\n  return result;\n}\n", "tests": "test('abc', () => eq(reverse('abc'), 'cba'));\ntest('empty', () => eq(reverse(''), ''));\ntest('palindrome', () => eq(reverse('level'), 'level'));\ntest('with spaces', () => eq(reverse('go now'), 'won og'));", "hints": ["Start with `let result = \"\"`.", "Put each new character in front: `result = ch + result`."]}, {"id": "u4.2.3", "title": "Draw a triangle", "prompt": "Write `triangle(n)` returning a string of `n` rows where row *k* has *k* stars, rows separated by `\"\\n\"`. `triangle(3)` is `\"*\\n**\\n***\"` (no trailing newline).", "starter": "// write triangle here\n", "solution": "function triangle(n) {\n  let result = \"\";\n  for (let row = 1; row <= n; row++) {\n    if (row > 1) result += \"\\n\";\n    result += \"*\".repeat(row);\n  }\n  return result;\n}\n", "tests": "test('triangle(3)', () => eq(triangle(3), \"*\\n**\\n***\"));\ntest('triangle(1)', () => eq(triangle(1), \"*\"));\ntest('triangle(0)', () => eq(triangle(0), \"\"));\ntest('triangle(5) rows', () => eq(triangle(5).split(\"\\n\").length, 5));", "hints": ["Use `\"*\".repeat(row)` or an inner loop.", "Add `\"\\n\"` only between rows."]}]}, {"id": "u4.3", "title": "Loop patterns: search, count, break, continue", "md": "Almost every loop you will write is one of a few patterns.\n\n### Counter\nCount items that meet a condition (like the vowels above).\n\n### Accumulator\nAdd up or build up a result (sum, product, string).\n\n### Search with early exit\nStop as soon as you find what you want. `break` leaves the loop; inside a function, `return` is even cleaner:\n\n```js\nfunction firstEvenBelow(limit) {\n  for (let i = 1; i < limit; i++) {\n    if (i % 2 === 0) return i;\n  }\n  return -1;   // not found\n}\nconsole.log(firstEvenBelow(10), firstEvenBelow(2));\n```\n\n### Skip with continue\n`continue` jumps to the next pass:\n\n```js\nfor (let i = 1; i <= 10; i++) {\n  if (i % 3 !== 0) continue;\n  console.log(i);\n}\n```\n\n### Loops that run until a condition changes\nWhen you do not know how many passes you need, use `while`. This one counts how many times you can halve a number before it drops below 1:\n\n```js\nlet n = 100, steps = 0;\nwhile (n >= 1) {\n  n = n / 2;\n  steps++;\n}\nconsole.log(steps);\n```\n\n> **Debugging loops:** print the loop variable inside the loop (`console.log(\"i =\", i)`) and compare what you see with what you expected. Do this before changing any code.", "ex": [{"id": "u4.3.1", "title": "FizzBuzz", "prompt": "Print the numbers 1 to 15, one per line. But for multiples of 3 print `Fizz`, for multiples of 5 print `Buzz`, and for multiples of both print `FizzBuzz`. (A famous interview warm-up.)", "starter": "// print FizzBuzz for 1..15\n", "solution": "for (let i = 1; i <= 15; i++) {\n  if (i % 15 === 0) console.log(\"FizzBuzz\");\n  else if (i % 3 === 0) console.log(\"Fizz\");\n  else if (i % 5 === 0) console.log(\"Buzz\");\n  else console.log(i);\n}\n", "tests": "test('FizzBuzz 1..15', () => eq(logs, ['1','2','Fizz','4','Buzz','Fizz','7','8','Fizz','Buzz','11','Fizz','13','14','FizzBuzz']));", "hints": ["Check \"both\" (divisible by 15) **first**.", "`i % 3 === 0` tests divisibility."]}, {"id": "u4.3.2", "title": "Prime check", "prompt": "Write `isPrime(n)`. A prime is greater than 1 and divisible only by 1 and itself. `isPrime(1)` is `false`; `isPrime(2)` is `true`.", "starter": "// write isPrime here\n", "solution": "function isPrime(n) {\n  if (n < 2) return false;\n  for (let i = 2; i * i <= n; i++) {\n    if (n % i === 0) return false;\n  }\n  return true;\n}\n", "tests": "test('0 and 1', () => { eq(isPrime(0), false); eq(isPrime(1), false); });\ntest('2 and 3', () => { eq(isPrime(2), true); eq(isPrime(3), true); });\ntest('4', () => eq(isPrime(4), false));\ntest('17', () => eq(isPrime(17), true));\ntest('91 = 7 x 13', () => eq(isPrime(91), false));\ntest('7919', () => eq(isPrime(7919), true));", "hints": ["Return early when you find a divisor.", "You only need to check divisors up to the square root of `n`."]}, {"id": "u4.3.3", "title": "Collatz steps", "prompt": "Start with any positive whole number `n`. If it is even, halve it; if odd, multiply by 3 and add 1. Repeat until you reach 1. Write `collatz(n)` returning how many steps that took. `collatz(6)` is 8 (6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1).", "starter": "// write collatz here\n", "solution": "function collatz(n) {\n  let steps = 0;\n  while (n !== 1) {\n    n = n % 2 === 0 ? n / 2 : n * 3 + 1;\n    steps++;\n  }\n  return steps;\n}\n", "tests": "test('collatz(1)', () => eq(collatz(1), 0));\ntest('collatz(6)', () => eq(collatz(6), 8));\ntest('collatz(7)', () => eq(collatz(7), 16));\ntest('collatz(27)', () => eq(collatz(27), 111));", "hints": ["This is a `while` loop: you do not know the number of passes in advance.", "Inside the loop: update `n`, add one to `steps`."]}]}], "quiz": [{"id": "u4-q1", "q": "What does this code print?", "code": "for (let i = 0; i < 3; i++) {\n  console.log(i);\n}", "o": ["0\n1\n2", "1\n2\n3", "0\n1\n2\n3", "0\n1"], "a": 0, "why": "i starts at 0 and the loop runs while i < 3, so it prints 0, 1, 2.", "mono": true}, {"id": "u4-q2", "q": "What does this code print?", "code": "let total = 0;\nfor (let i = 1; i <= 4; i++) total += i;\nconsole.log(total);", "o": ["10", "6", "4", "24"], "a": 0, "why": "1 + 2 + 3 + 4 = 10.", "mono": true}, {"id": "u4-q3", "q": "What does this code print?", "code": "let s = \"\";\nfor (const ch of \"abc\") s = ch + s;\nconsole.log(s);", "o": ["cba", "abc", "ccc", "cab"], "a": 0, "why": "Each new character is placed in front, which reverses the string.", "mono": true}, {"id": "u4-q4", "q": "What does this code print?", "code": "let n = 0;\nwhile (n < 3) {\n  n++;\n}\nconsole.log(n);", "o": ["3", "2", "4", "0"], "a": 0, "why": "The loop stops as soon as n is no longer less than 3, so n ends at 3.", "mono": true}, {"id": "u4-q5", "q": "What does this code print?", "code": "for (let i = 1; i <= 5; i++) {\n  if (i % 2 === 0) continue;\n  console.log(i);\n}", "o": ["1\n3\n5", "2\n4", "1\n2\n3\n4\n5", "1\n3"], "a": 0, "why": "continue skips the even numbers.", "mono": true}, {"id": "u4-q6", "q": "What does this code print?", "code": "let count = 0;\nfor (let a = 0; a < 3; a++) {\n  for (let b = 0; b < 4; b++) count++;\n}\nconsole.log(count);", "o": ["12", "7", "3", "4"], "a": 0, "why": "The inner loop runs 4 times for each of the 3 outer passes: 3 x 4 = 12.", "mono": true}, {"id": "u4-q7", "q": "A loop whose condition never becomes false is called:", "code": null, "o": ["An infinite loop", "A nested loop", "A recursive loop", "A lazy loop"], "a": 0, "why": "Without a change that eventually ends it, the loop keeps running until the program is stopped.", "mono": false}, {"id": "u4-q8", "q": "What does `break` do inside a loop?", "code": null, "o": ["Exits the loop immediately", "Skips to the next pass", "Restarts the loop", "Pauses for one second"], "a": 0, "why": "`break` leaves the loop. `continue` skips to the next pass.", "mono": false}]}, {"id": "u5", "num": 5, "title": "Functions in Depth", "objectives": ["Explain scope and why variables disappear", "Write arrow functions, default parameters and rest parameters", "Break problems into small pure functions and test them"], "lessons": [{"id": "u5.1", "title": "Scope and return values", "md": "**Scope** is where a name can be seen. A variable declared with `let` or `const` lives only inside the **block** (`{ }`) where it was created. Parameters and variables declared inside a function are invisible outside it.\n\n```js throws\nfunction area(w, h) {\n  const result = w * h;\n  return result;\n}\nconsole.log(area(2, 3));\nconsole.log(result);\n```\n\n`result` exists only inside `area`. The function **returns the value**, and the caller decides what to name it:\n\n```js\nfunction area(w, h) { return w * h; }\nconst a = area(2, 3);\nconsole.log(a);\n```\n\n### Inner scopes can see outward\n\nCode inside a function can read variables from the surrounding scope. A variable with the same name **shadows** (hides) the outer one:\n\n```js\nconst x = \"outer\";\nfunction show() {\n  const x = \"inner\";\n  console.log(x);\n}\nshow();\nconsole.log(x);\n```\n\n### Block scope\n\n```js throws\nfor (let i = 0; i < 2; i++) {\n  const doubled = i * 2;\n}\nconsole.log(doubled);\n```\n\n### Keep functions self-contained\n\nA good function gets everything it needs through **parameters** and gives its answer through **return**. Avoid reading and changing variables that live outside, which makes behavior hard to predict:\n\n```js\nlet counter = 0;\nfunction bad() { counter++; }          // changes outside state (a side effect)\nfunction good(n) { return n + 1; }     // depends only on its input\n```\n\nA function with no side effects that always returns the same output for the same input is called **pure**. Pure functions are the easiest to understand, test and reuse.\n\nA function can return **only one value**, but that value can be an array or object holding several results (covered in the next units).", "ex": [{"id": "u5.1.1", "title": "Largest of three", "prompt": "Write `max3(a, b, c)` returning the largest of the three numbers **without** using `Math.max`.", "starter": "// write max3 here\n", "solution": "function max3(a, b, c) {\n  let largest = a;\n  if (b > largest) largest = b;\n  if (c > largest) largest = c;\n  return largest;\n}\n", "tests": "test('first is largest', () => eq(max3(9, 2, 4), 9));\ntest('middle is largest', () => eq(max3(1, 8, 3), 8));\ntest('last is largest', () => eq(max3(1, 2, 7), 7));\ntest('negatives', () => eq(max3(-5, -2, -9), -2));\ntest('ties', () => eq(max3(4, 4, 4), 4));\ntest('does not use Math.max', () => { const orig = Math.max; let used = false; Math.max = function(){ used = true; return orig.apply(Math, arguments); }; try { max3(1,2,3); } finally { Math.max = orig; } eq(used, false); });", "hints": ["Keep a variable `largest` and compare each value against it."]}]}, {"id": "u5.2", "title": "Arrow functions, defaults and rest", "md": "Functions are **values**. You can store them in variables and pass them around. A **function expression** and the shorter **arrow function** syntax both create functions:\n\n```js\nconst double = function (n) { return n * 2; };\nconst triple = (n) => { return n * 3; };\nconst square = (n) => n * n;          // one expression: implicit return\nconst add = (a, b) => a + b;\nconsole.log(double(4), triple(4), square(4), add(4, 5));\n```\n\nFor one expression, the arrow form with no braces **returns it automatically**. With braces you must write `return`.\n\n### Default parameters\n\nProvide a fallback when an argument is missing:\n\n```js\nfunction greet(name = \"friend\", punctuation = \"!\") {\n  return `Hello, ${name}${punctuation}`;\n}\nconsole.log(greet());\nconsole.log(greet(\"Sam\"));\nconsole.log(greet(\"Sam\", \"?\"));\n```\n\n### Rest parameters\n\n`...nums` collects any number of arguments into an **array**:\n\n```js\nfunction sum(...nums) {\n  let total = 0;\n  for (const n of nums) total += n;\n  return total;\n}\nconsole.log(sum(1, 2, 3), sum(10), sum());\n```\n\n### Functions calling functions\n\nSmall functions can build on each other:\n\n```js\nconst isEven = (n) => n % 2 === 0;\nconst describe = (n) => `${n} is ${isEven(n) ? \"even\" : \"odd\"}`;\nconsole.log(describe(3), describe(8));\n```\n\nPassing a function **into** another function is a powerful idea. It is how `map`, `filter` and event handlers work. You will use it heavily in unit 8.", "ex": [{"id": "u5.2.1", "title": "Greeting with a default", "prompt": "Write `greet(name)` returning `\"Hello, <name>!\"`. If no name is given, use `\"friend\"`.", "starter": "// write greet here\n", "solution": "function greet(name = \"friend\") {\n  return `Hello, ${name}!`;\n}\n", "tests": "test('with a name', () => eq(greet('Sam'), 'Hello, Sam!'));\ntest('without a name', () => eq(greet(), 'Hello, friend!'));", "hints": ["Give the parameter a default: `name = \"friend\"`."]}, {"id": "u5.2.2", "title": "Sum anything", "prompt": "Write `sumAll(...numbers)` returning the sum of any number of arguments (0 for none).", "starter": "// write sumAll here\n", "solution": "function sumAll(...numbers) {\n  let total = 0;\n  for (const n of numbers) total += n;\n  return total;\n}\n", "tests": "test('three numbers', () => eq(sumAll(1, 2, 3), 6));\ntest('one number', () => eq(sumAll(10), 10));\ntest('none', () => eq(sumAll(), 0));\ntest('decimals', () => approx(sumAll(0.5, 0.25), 0.75));", "hints": ["`...numbers` becomes an array you can loop over with `for...of`."]}, {"id": "u5.2.3", "title": "Arrow function", "prompt": "Create a constant `isAdult` that is an **arrow function** taking `age` and returning `true` for 18 or older.", "starter": "// const isAdult = ...\n", "solution": "const isAdult = (age) => age >= 18;\n", "tests": "test('18 is an adult', () => eq(isAdult(18), true));\ntest('17 is not', () => eq(isAdult(17), false));\ntest('is a function', () => eq(typeof isAdult, 'function'));", "hints": ["`const isAdult = (age) => ...`", "No braces means the expression is returned."]}]}, {"id": "u5.3", "title": "Decomposition and testing", "md": "**Decomposition** means splitting a big problem into small functions that each do one thing well. Compare:\n\n```js\nfunction isLeapYear(year) {\n  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;\n}\n\nfunction daysInFebruary(year) {\n  return isLeapYear(year) ? 29 : 28;\n}\n\nconsole.log(isLeapYear(1900), isLeapYear(2000), isLeapYear(2024));\nconsole.log(daysInFebruary(2024), daysInFebruary(2023));\n```\n\nEach function has one job and a good name, so the code reads like sentences.\n\n### How to design a function\n\n1. **Say what it does** in one sentence (\"returns true when the year is a leap year\").\n2. **List example inputs and expected outputs**, including awkward ones (zero, negative, empty).\n3. **Write the code.**\n4. **Check it against your examples.**\n\nYou can do step 4 with a tiny helper. This is exactly how the exercises in this course grade your work:\n\n```js\nfunction check(label, actual, expected) {\n  const ok = actual === expected;\n  console.log(ok ? \"PASS\" : \"FAIL\", label, ok ? \"\" : `(expected ${expected}, got ${actual})`);\n}\n\nconst double = (n) => n * 2;\ncheck(\"double(4)\", double(4), 8);\ncheck(\"double(0)\", double(0), 0);\ncheck(\"double(-3)\", double(-3), -6);\n```\n\nProfessional developers write automated tests like these so they can change code later without fear. Start the habit now: **before** you write a function, write two or three checks for it.\n\n### Naming\n\n- Functions are **verbs**: `calculateTax`, `isValid`, `getTotal`.\n- Booleans start with `is`, `has` or `can`.\n- Avoid abbreviations nobody would guess.", "ex": [{"id": "u5.3.1", "title": "Leap year and days in month", "prompt": "A year is a leap year if it is divisible by 4, except years divisible by 100 are not, unless also divisible by 400. Write `isLeapYear(year)` and `daysInMonth(month, year)`. Months are 1 to 12. April, June, September, November have 30 days; February has 28 (29 in a leap year); the rest have 31. Use `isLeapYear` inside `daysInMonth`.", "starter": "// write isLeapYear and daysInMonth here\n", "solution": "function isLeapYear(year) {\n  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;\n}\nfunction daysInMonth(month, year) {\n  if (month === 2) return isLeapYear(year) ? 29 : 28;\n  if (month === 4 || month === 6 || month === 9 || month === 11) return 30;\n  return 31;\n}\n", "tests": "test('2024 is leap', () => eq(isLeapYear(2024), true));\ntest('1900 is not leap', () => eq(isLeapYear(1900), false));\ntest('2000 is leap', () => eq(isLeapYear(2000), true));\ntest('2023 is not leap', () => eq(isLeapYear(2023), false));\ntest('Feb 2024', () => eq(daysInMonth(2, 2024), 29));\ntest('Feb 2023', () => eq(daysInMonth(2, 2023), 28));\ntest('April', () => eq(daysInMonth(4, 2023), 30));\ntest('December', () => eq(daysInMonth(12, 2023), 31));", "hints": ["Write `isLeapYear` first and test it alone.", "Handle February by calling `isLeapYear(year)`."]}, {"id": "u5.3.2", "title": "Body mass index", "prompt": "Write `bmi(weightKg, heightM)` returning weight / height² rounded to **one decimal place** (a number), and `bmiCategory(value)` returning `\"underweight\"` (below 18.5), `\"normal\"` (below 25), `\"overweight\"` (below 30) or `\"obese\"`. Keep them as two separate functions.", "starter": "// write bmi and bmiCategory here\n", "solution": "function bmi(weightKg, heightM) {\n  return Math.round(weightKg / (heightM * heightM) * 10) / 10;\n}\nfunction bmiCategory(value) {\n  if (value < 18.5) return \"underweight\";\n  if (value < 25) return \"normal\";\n  if (value < 30) return \"overweight\";\n  return \"obese\";\n}\n", "tests": "test('bmi 70kg 1.75m', () => eq(bmi(70, 1.75), 22.9));\ntest('bmi 90kg 1.8m', () => eq(bmi(90, 1.8), 27.8));\ntest('returns a number', () => eq(typeof bmi(70, 1.75), 'number'));\ntest('underweight', () => eq(bmiCategory(17), 'underweight'));\ntest('normal edge', () => eq(bmiCategory(18.5), 'normal'));\ntest('overweight', () => eq(bmiCategory(27.8), 'overweight'));\ntest('obese', () => eq(bmiCategory(30), 'obese'));", "hints": ["To round to one decimal: `Math.round(x * 10) / 10`.", "Square the height with `heightM * heightM`."]}]}], "quiz": [{"id": "u5-q1", "q": "What does this code print?", "code": "const x = \"outer\";\nfunction show() {\n  const x = \"inner\";\n  return x;\n}\nconsole.log(show(), x);", "o": ["inner outer", "outer outer", "inner inner", "outer inner"], "a": 0, "why": "The inner x shadows the outer x only inside the function.", "mono": true}, {"id": "u5-q2", "q": "What does this code print?", "code": "const add = (a, b) => a + b;\nconsole.log(add(2, 3), add(\"2\", 3));", "o": ["5 23", "5 5", "23 23", "5 NaN"], "a": 0, "why": "Numbers add. When one side is a string, + joins text.", "mono": true}, {"id": "u5-q3", "q": "What does this code print?", "code": "function greet(name = \"friend\") {\n  return \"Hi \" + name;\n}\nconsole.log(greet(), greet(\"Sam\"));", "o": ["Hi friend Hi Sam", "Hi undefined Hi Sam", "Hi Sam Hi Sam", "Hi friend Hi friend"], "a": 0, "why": "The default only applies when the argument is missing.", "mono": true}, {"id": "u5-q4", "q": "What does this code print?", "code": "function sum(...n) {\n  let t = 0;\n  for (const x of n) t += x;\n  return t;\n}\nconsole.log(sum(1, 2, 3, 4));", "o": ["10", "[1, 2, 3, 4]", "4", "0"], "a": 0, "why": "Rest parameters collect the arguments into an array, which the loop adds up.", "mono": true}, {"id": "u5-q5", "q": "What does this code print?", "code": "const f = (n) => { n * 2; };\nconsole.log(f(5));", "o": ["undefined", "10", "5", "NaN"], "a": 0, "why": "With braces you must write return. Without it the function gives back undefined.", "mono": true}, {"id": "u5-q6", "q": "What makes a function \"pure\"?", "code": null, "o": ["Same inputs always give the same output, with no side effects", "It has no parameters", "It uses a loop", "It prints to the console"], "a": 0, "why": "Pure functions depend only on their inputs and change nothing outside, so they are easy to reason about and test.", "mono": false}, {"id": "u5-q7", "q": "Which is true about a variable declared with `const` inside a function?", "code": null, "o": ["It cannot be seen outside that function", "It is available everywhere", "It can be reassigned freely", "It disappears after one line"], "a": 0, "why": "Variables declared inside a function are scoped to that function.", "mono": false}]}, {"id": "u6", "num": 6, "title": "Arrays", "objectives": ["Create, read, change and loop over arrays", "Use push, pop, slice, splice, includes, indexOf, join and sort", "Apply the common array patterns: total, max, search, filter, unique"], "lessons": [{"id": "u6.1", "title": "Lists of values", "md": "An **array** is an ordered list of values. Square brackets create one; positions start at **0**:\n\n```js\nconst fruits = [\"apple\", \"banana\", \"cherry\"];\nconsole.log(fruits[0]);\nconsole.log(fruits[2]);\nconsole.log(fruits.length);\nconsole.log(fruits[5]);          // no such position\nconsole.log(fruits[fruits.length - 1]);   // the last item\n```\n\n### Changing arrays\n\n`const` stops you from re-pointing the **variable**, but the contents can still change:\n\n```js\nconst list = [10, 20];\nlist.push(30);        // add to the end\nlist[0] = 5;          // replace by position\nconsole.log(list);\nconst last = list.pop();   // remove and return the last item\nconsole.log(last, list);\nlist.unshift(1);      // add to the front\nlist.shift();         // remove from the front\nconsole.log(list);\n```\n\n### Looping\n\n```js\nconst scores = [90, 72, 85];\nfor (const s of scores) console.log(s);\nfor (let i = 0; i < scores.length; i++) {\n  console.log(i, scores[i]);\n}\n```\n\nUse `for...of` when you only need the values and the indexed `for` when you need positions.\n\n### Useful tools\n\n```js\nconst nums = [3, 1, 2];\nconsole.log(nums.includes(2));     // is it in there?\nconsole.log(nums.indexOf(2));      // position, or -1 if missing\nconsole.log(nums.join(\" - \"));     // array to string\nconsole.log(\"a,b,c\".split(\",\"));   // string to array\nconsole.log([...\"hey\"]);           // spread: array of characters\nconsole.log([...nums, 99]);        // copy with one more item\n```\n\n> Printing an array with `console.log` shows its contents. `typeof []` is `\"object\"`; use `Array.isArray(x)` to check for an array.", "ex": [{"id": "u6.1.1", "title": "Sum of an array", "prompt": "Write `sum(numbers)` that returns the total of an array of numbers (0 for an empty array).", "starter": "// write sum here\n", "solution": "function sum(numbers) {\n  let total = 0;\n  for (const n of numbers) total += n;\n  return total;\n}\n", "tests": "test('basic', () => eq(sum([1, 2, 3, 4]), 10));\ntest('empty', () => eq(sum([]), 0));\ntest('negatives', () => eq(sum([-5, 5, 10]), 10));", "hints": ["Accumulator pattern: start at 0 and add each item."]}, {"id": "u6.1.2", "title": "Largest item", "prompt": "Write `largest(numbers)` returning the biggest number in a non-empty array. Do not use `Math.max`.", "starter": "// write largest here\n", "solution": "function largest(numbers) {\n  let best = numbers[0];\n  for (const n of numbers) {\n    if (n > best) best = n;\n  }\n  return best;\n}\n", "tests": "test('basic', () => eq(largest([3, 9, 2]), 9));\ntest('single', () => eq(largest([7]), 7));\ntest('negatives', () => eq(largest([-8, -3, -20]), -3));\ntest('first is biggest', () => eq(largest
